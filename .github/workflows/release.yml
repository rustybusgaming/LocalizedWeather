name: Release & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # The release and its notes are created once, here, rather than inside the
  # matrix. action-gh-release regenerates the notes every time it updates a
  # release, so generating them per target stacked one "What's Changed" section
  # onto the body per Minecraft version.
  create-release:
    runs-on: ubuntu-latest
    name: Create GitHub Release
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Read mod version
        id: version
        run: |
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          echo "mod_version=$MOD_VERSION" >> "$GITHUB_OUTPUT"

      # The v1.4.1 attempt was pushed as a tag on a months-old commit, so this
      # workflow ran that commit's copy of itself: it built 1.4.0 jars, named
      # the release after them, skipped the targets and loaders added since,
      # and then failed five times over on a Modrinth bug that had already been
      # fixed on main. Nothing in it noticed that the tag and the version
      # disagreed.
      #
      # A tag that does not match the version it releases is always a mistake,
      # so it stops the run here, before anything is published, and says which
      # of the two to move. The loader modules carry their own mod_version and
      # the published version strings come from those files, so they are
      # checked against the root rather than left to drift.
      - name: Check the tag matches the mod version
        run: |
          TAG="${GITHUB_REF_NAME}"
          ROOT="${{ steps.version.outputs.mod_version }}"

          if [ "$TAG" != "v$ROOT" ]; then
            echo "::error::Tag ${TAG} does not match mod_version ${ROOT} in gradle.properties." \
                 "Either bump mod_version to ${TAG#v} and re-tag, or move ${TAG} to a commit whose mod_version is ${TAG#v}." \
                 "A tag on an older commit also runs that commit's workflow, so the release would miss everything added since."
            exit 1
          fi

          for f in neoforge/gradle.properties forge/gradle.properties; do
            MODULE=$(grep '^mod_version=' "$f" | cut -d= -f2)
            if [ "$MODULE" != "$ROOT" ]; then
              echo "::error file=${f}::mod_version is ${MODULE}, but the root gradle.properties says ${ROOT}." \
                   "The jar this module publishes is named from its own file, so the two have to agree."
              exit 1
            fi
          done

          echo "Releasing v${ROOT} from ${GITHUB_SHA}."

      - name: Create the release
        uses: softprops/action-gh-release@v3
        with:
          name: Localized Weather v${{ steps.version.outputs.mod_version }}
          generate_release_notes: true
          draft: false
          prerelease: false

  release:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      # Publish one target at a time so a failure on one Minecraft line does not
      # cancel the others, and so uploads stay in a predictable order.
      max-parallel: 1
      fail-fast: false
      matrix:
        target: ['1.21.9', '1.21.10', '1.21.11', '26.1.2', '26.2', '26.3']
    name: Release (Minecraft ${{ matrix.target }})
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up JDKs
        uses: actions/setup-java@v5
        with:
          # 1.21.x builds on a Java 21 daemon and 26.x on a Java 25 one; the
          # last listed version is the one Gradle runs on, and the toolchain
          # resolves the other.
          java-version: |
            21
            25
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build -Pmc=${{ matrix.target }}

      - name: Read target properties
        id: target
        run: |
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          MC_VERSION=$(grep '^minecraft_version=' versions/${{ matrix.target }}.properties | cut -d= -f2)
          GAME_VERSIONS=$(grep '^game_versions=' versions/${{ matrix.target }}.properties | cut -d= -f2 | tr ',' '\n')

          {
            echo "mod_version=$MOD_VERSION"
            echo "mc_version=$MC_VERSION"
            echo "release_version=$MOD_VERSION+$MC_VERSION"
            echo "game_versions<<EOF"
            echo "$GAME_VERSIONS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Find release jars
        id: jars
        run: |
          FABRIC_JAR=$(find build/libs -maxdepth 1 -type f -name "localweather-*+${{ steps.target.outputs.mc_version }}.jar" ! -name '*-sources.jar' ! -name '*-quilt.jar' -print -quit)
          QUILT_JAR=$(find build/libs -maxdepth 1 -type f -name "localweather-*+${{ steps.target.outputs.mc_version }}-quilt.jar" -print -quit)

          # Spelled out rather than `test -n "$JAR" && test -f "$JAR"`: a
          # step runs under `bash -e`, which does not exit when the failing
          # command sits on the left of an `&&`, so that line reported a
          # missing jar to nobody and the publish carried on with an empty
          # file list.
          if [ -z "$FABRIC_JAR" ] || [ ! -f "$FABRIC_JAR" ]; then
            echo "::error::No Fabric jar for ${{ steps.target.outputs.mc_version }} in build/libs."
            exit 1
          fi

          # The Quilt jar is genuinely optional: Quilt publishes no intermediate
          # namespace for 26.x, so the build makes one only for the 1.21.x line.
          if [ -n "$QUILT_JAR" ] && [ ! -f "$QUILT_JAR" ]; then
            echo "::error::Quilt jar ${QUILT_JAR} was named but does not exist."
            exit 1
          fi

          {
            echo "fabric=$FABRIC_JAR"
            echo "quilt=$QUILT_JAR"
            echo "files<<EOF"
            echo "$FABRIC_JAR"
            echo "$QUILT_JAR"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Fabric jar: $FABRIC_JAR"
          echo "Quilt jar: $QUILT_JAR"

      # Only attaches this target's jars. The release, its name and its notes
      # were settled by the create-release job, so nothing here rewrites them.
      - name: Upload jars to the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.jars.outputs.files }}
          generate_release_notes: false

      # Modrinth's version-create API wants the project's base62 id in the
      # request body, and rejects a slug with
      # "Base62 decoding overflowed" — which is what every release from v1.2.1
      # to v1.4.0 died on, because MODRINTH_PROJECT_ID held the slug. Resolving
      # through the API accepts either spelling, so the variable can hold the
      # slug, the id, or nothing at all, and a project that genuinely cannot be
      # resolved fails here with a readable message instead of a 400 later.
      - name: Resolve Modrinth project ID
        id: modrinth
        run: |
          REF="${{ vars.MODRINTH_PROJECT_ID }}"
          REF="${REF:-localizedweather}"
          RESOLVED=$(curl -fsSL --retry 3 --retry-delay 2 \
            "https://api.modrinth.com/v2/project/${REF}" | jq -r '.id // empty')
          if [ -z "$RESOLVED" ]; then
            echo "::error::Could not resolve Modrinth project '${REF}'."
            exit 1
          fi
          echo "Resolved Modrinth project '${REF}' to id ${RESOLVED}"
          echo "id=${RESOLVED}" >> "$GITHUB_OUTPUT"

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ steps.modrinth.outputs.id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: ${{ steps.jars.outputs.fabric }}
          name: Localized Weather v${{ steps.target.outputs.release_version }}
          version: ${{ steps.target.outputs.release_version }}
          version-type: release
          loaders: fabric
          game-versions: ${{ steps.target.outputs.game_versions }}
          modrinth-dependencies: |
            P7dR8mSH(required)
            mOgUt4GM(optional)

      # CurseForge only accepts its numeric project id and cannot resolve a
      # slug, and there is no public endpoint to look one up, so it cannot be
      # normalised through the API the way the Modrinth id is. The variable is
      # used when it is numeric and the known id is used otherwise, so a wrong
      # value warns rather than dropping CurseForge from the release.
      - name: Resolve CurseForge project ID
        id: cf
        env:
          # LocalizedWeather's CurseForge project id. Public — it is printed on
          # the project page — and hardcoded so a wrong or missing variable
          # cannot silently drop CurseForge from a release again.
          DEFAULT_ID: '1515451'
        run: |
          ID="${{ vars.CURSEFORGE_PROJECT_ID }}"
          if [[ ! "$ID" =~ ^[0-9]+$ ]]; then
            echo "::warning::CURSEFORGE_PROJECT_ID is '${ID:-<unset>}', which is not a numeric project id; using ${DEFAULT_ID}."
            ID="$DEFAULT_ID"
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Publish to CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ steps.cf.outputs.id }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ steps.jars.outputs.fabric }}
          name: Localized Weather v${{ steps.target.outputs.release_version }}
          version: ${{ steps.target.outputs.release_version }}
          version-type: release
          loaders: fabric
          game-versions: ${{ steps.target.outputs.game_versions }}
          dependencies: |
            fabric-api(required)
            modmenu(optional)

  # NeoForge is a separate Gradle build with its own jar, its own loader and no
  # Fabric API dependency, so it cannot ride the -Pmc matrix above and gets its
  # own job. The game versions come from versions/26.1.2.properties so the two
  # builds keep one source of truth for what 26.1.x covers.
  release-neoforge:
    needs: create-release
    runs-on: ubuntu-latest
    name: Release (NeoForge)
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew -p neoforge build

      - name: Read target properties
        id: target
        run: |
          MOD_VERSION=$(grep '^mod_version=' neoforge/gradle.properties | cut -d= -f2)
          MC_VERSION=$(grep '^minecraft_version=' neoforge/gradle.properties | cut -d= -f2)
          GAME_VERSIONS=$(grep '^game_versions=' versions/26.1.2.properties | cut -d= -f2 | tr ',' '\n')

          {
            echo "release_version=$MOD_VERSION+$MC_VERSION-neoforge"
            echo "game_versions<<EOF"
            echo "$GAME_VERSIONS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Find release jar
        id: jar
        run: |
          JAR=$(find neoforge/build/libs -maxdepth 1 -type f -name "localweather-*-neoforge.jar" ! -name '*-sources.jar' -print -quit)
          # See the Fabric job: `test -n ... && test -f ...` never fails a step.
          if [ -z "$JAR" ] || [ ! -f "$JAR" ]; then
            echo "::error::No jar found in build/libs for this module."
            exit 1
          fi
          echo "file=$JAR" >> "$GITHUB_OUTPUT"

      - name: Upload jar to the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.jar.outputs.file }}
          generate_release_notes: false

      - name: Resolve Modrinth project ID
        id: modrinth
        run: |
          REF="${{ vars.MODRINTH_PROJECT_ID }}"
          REF="${REF:-localizedweather}"
          RESOLVED=$(curl -fsSL --retry 3 --retry-delay 2 \
            "https://api.modrinth.com/v2/project/${REF}" | jq -r '.id // empty')
          if [ -z "$RESOLVED" ]; then
            echo "::error::Could not resolve Modrinth project '${REF}'."
            exit 1
          fi
          echo "id=${RESOLVED}" >> "$GITHUB_OUTPUT"

      # No fabric-api or modmenu dependency here: neither is a NeoForge mod.
      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ steps.modrinth.outputs.id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: ${{ steps.jar.outputs.file }}
          name: Localized Weather v${{ steps.target.outputs.release_version }}
          version: ${{ steps.target.outputs.release_version }}
          version-type: release
          loaders: neoforge
          game-versions: ${{ steps.target.outputs.game_versions }}

      - name: Resolve CurseForge project ID
        id: cf
        env:
          DEFAULT_ID: '1515451'
        run: |
          ID="${{ vars.CURSEFORGE_PROJECT_ID }}"
          if [[ ! "$ID" =~ ^[0-9]+$ ]]; then
            echo "::warning::CURSEFORGE_PROJECT_ID is '${ID:-<unset>}', which is not a numeric project id; using ${DEFAULT_ID}."
            ID="$DEFAULT_ID"
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Publish to CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ steps.cf.outputs.id }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ steps.jar.outputs.file }}
          name: Localized Weather v${{ steps.target.outputs.release_version }}
          version: ${{ steps.target.outputs.release_version }}
          version-type: release
          loaders: neoforge
          game-versions: ${{ steps.target.outputs.game_versions }}

  release-forge:
    needs: create-release
    runs-on: ubuntu-latest
    name: Release (Forge)
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew -p forge build

      - name: Read target properties
        id: target
        run: |
          MOD_VERSION=$(grep '^mod_version=' forge/gradle.properties | cut -d= -f2)
          MC_VERSION=$(grep '^minecraft_version=' forge/gradle.properties | cut -d= -f2)
          GAME_VERSIONS=$(grep '^game_versions=' versions/26.1.2.properties | cut -d= -f2 | tr ',' '\n')

          {
            echo "release_version=$MOD_VERSION+$MC_VERSION-forge"
            echo "game_versions<<EOF"
            echo "$GAME_VERSIONS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Find release jar
        id: jar
        run: |
          JAR=$(find forge/build/libs -maxdepth 1 -type f -name "localweather-*-forge.jar" ! -name '*-sources.jar' -print -quit)
          # See the Fabric job: `test -n ... && test -f ...` never fails a step.
          if [ -z "$JAR" ] || [ ! -f "$JAR" ]; then
            echo "::error::No jar found in build/libs for this module."
            exit 1
          fi
          echo "file=$JAR" >> "$GITHUB_OUTPUT"

      - name: Upload jar to the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.jar.outputs.file }}
          generate_release_notes: false

      - name: Resolve Modrinth project ID
        id: modrinth
        run: |
          REF="${{ vars.MODRINTH_PROJECT_ID }}"
          REF="${REF:-localizedweather}"
          RESOLVED=$(curl -fsSL --retry 3 --retry-delay 2 \
            "https://api.modrinth.com/v2/project/${REF}" | jq -r '.id // empty')
          if [ -z "$RESOLVED" ]; then
            echo "::error::Could not resolve Modrinth project '${REF}'."
            exit 1
          fi
          echo "id=${RESOLVED}" >> "$GITHUB_OUTPUT"

      # No fabric-api or modmenu dependency here: neither is a Forge mod.
      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ steps.modrinth.outputs.id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: ${{ steps.jar.outputs.file }}
          name: Localized Weather v${{ steps.target.outputs.release_version }}
          version: ${{ steps.target.outputs.release_version }}
          version-type: release
          loaders: forge
          game-versions: ${{ steps.target.outputs.game_versions }}

      - name: Resolve CurseForge project ID
        id: cf
        env:
          DEFAULT_ID: '1515451'
        run: |
          ID="${{ vars.CURSEFORGE_PROJECT_ID }}"
          if [[ ! "$ID" =~ ^[0-9]+$ ]]; then
            echo "::warning::CURSEFORGE_PROJECT_ID is '${ID:-<unset>}', which is not a numeric project id; using ${DEFAULT_ID}."
            ID="$DEFAULT_ID"
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Publish to CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ steps.cf.outputs.id }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ steps.jar.outputs.file }}
          name: Localized Weather v${{ steps.target.outputs.release_version }}
          version: ${{ steps.target.outputs.release_version }}
          version-type: release
          loaders: forge
          game-versions: ${{ steps.target.outputs.game_versions }}
