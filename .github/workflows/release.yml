name: Release & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build

      - name: Get mod version
        id: version
        run: echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Get Minecraft version
        id: mcversion
        run: echo "mc=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Find release jars
        id: jars
        run: |
          FABRIC_JAR=$(find build/libs -maxdepth 1 -type f -name 'localweather-*.jar' ! -name '*-sources.jar' ! -name '*-quilt.jar' -print -quit)
          QUILT_JAR=$(find build/libs -maxdepth 1 -type f -name 'localweather-*-quilt.jar' -print -quit)

          test -n "$FABRIC_JAR" && test -f "$FABRIC_JAR"
          test -n "$QUILT_JAR" && test -f "$QUILT_JAR"

          {
            echo "fabric=$FABRIC_JAR"
            echo "quilt=$QUILT_JAR"
            echo "files<<EOF"
            echo "$FABRIC_JAR"
            echo "$QUILT_JAR"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Fabric jar: $FABRIC_JAR"
          echo "Quilt jar: $QUILT_JAR"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Localized Weather v${{ steps.version.outputs.version }}
          files: ${{ steps.jars.outputs.files }}
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: ${{ steps.jars.outputs.fabric }}
          name: Localized Weather v${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          version-type: release
          loaders: fabric
          game-versions: ${{ steps.mcversion.outputs.mc }}
          dependencies: |
            fabric-api(required)
            modmenu(optional)

      - name: Publish to CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ steps.jars.outputs.fabric }}
          name: Localized Weather v${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          version-type: release
          loaders: fabric
          game-versions: ${{ steps.mcversion.outputs.mc }}
          dependencies: |
            fabric-api(required)
            modmenu(optional)
