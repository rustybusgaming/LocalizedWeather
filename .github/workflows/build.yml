name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One entry per file in versions/. Minecraft 26.x is unobfuscated, so a
        # single source tree compiles against every target in this list.
        target: ['1.21.9', '1.21.10', '1.21.11', '26.1.2', '26.2', '26.3']
    name: Build (Minecraft ${{ matrix.target }})
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up JDKs
        uses: actions/setup-java@v5
        with:
          # 1.21.x builds on a Java 21 daemon and 26.x on a Java 25 one; the
          # last listed version is the one Gradle runs on, and the toolchain
          # resolves the other.
          java-version: |
            21
            25
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build -Pmc=${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: localweather-mod-${{ matrix.target }}
          path: build/libs/*.jar
          if-no-files-found: error

  loaders:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # NeoForge and Forge are separate Gradle builds with their own
        # settings.gradle, so they cannot ride the -Pmc matrix above. They take
        # a -Pmc of their own, and every target a module accepts is listed here:
        # a module built only on its default target is a module whose other
        # targets nothing compiles.
        include:
          - module: neoforge
            target: '26.1.2'
          - module: neoforge
            target: '1.21.1'
          - module: forge
            target: '26.1.2'
    name: Build (${{ matrix.module }} ${{ matrix.target }})
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up JDKs
        uses: actions/setup-java@v5
        with:
          # 26.x needs Java 25 and the 1.21.x NeoForge target needs 21. The
          # last listed version is the one Gradle runs on; these builds declare
          # a toolchain rather than a foojay resolver, so the other has to be
          # installed here for it to resolve.
          java-version: |
            21
            25
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew -p ${{ matrix.module }} build -Pmc=${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: localweather-mod-${{ matrix.module }}-${{ matrix.target }}
          path: ${{ matrix.module }}/build/libs/*.jar
          if-no-files-found: error
