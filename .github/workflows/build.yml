name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One entry per file in versions/. Minecraft 26.x is unobfuscated, so a
        # single source tree compiles against every target in this list.
        target: ['1.21.9', '1.21.10', '1.21.11', '26.1.2', '26.2']
    name: Build (Minecraft ${{ matrix.target }})
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up JDKs
        uses: actions/setup-java@v5
        with:
          # 1.21.x builds on a Java 21 daemon and 26.x on a Java 25 one; the
          # last listed version is the one Gradle runs on, and the toolchain
          # resolves the other.
          java-version: |
            21
            25
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build -Pmc=${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: localweather-mod-${{ matrix.target }}
          path: build/libs/*.jar
          if-no-files-found: error
