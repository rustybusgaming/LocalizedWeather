modLoader="javafml"
loaderVersion="[${forge_spec_version},)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="fentbusgaming"
description='''
Per-zone localized weather with biome-aware rules, moving thunderstorm cells and smooth transitions.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="[${forge_spec_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="[${minecraft_version},${minecraft_version_next})"
    ordering="NONE"
    side="BOTH"
