pluginManagement {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        gradlePluginPortal()
    }
}

plugins {
    // Forge 26.x targets Java 25; let Gradle fetch a matching JDK.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'localizedweather-forge'
