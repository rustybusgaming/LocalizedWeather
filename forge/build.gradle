plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.mod_group_id

base {
    archivesName = project.archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// The loader-agnostic half of the mod is compiled straight from the Fabric
// tree rather than copied. Minecraft 26.x uses Mojang's own names on Fabric,
// NeoForge and Forge alike, so the simulation is common to all three and only
// the glue differs.
sourceSets {
    main {
        java.srcDirs += [
            "${rootDir}/../src/shared/java",
            "${rootDir}/../src/v26/common/java",
            "${rootDir}/../src/v26/clientcommon/java",
            "${rootDir}/../src/forge/main/java",
            "${rootDir}/../src/forge/client/java"
        ]
    }
}

// A dev run loads the mod from loose directories rather than a jar, and FML's
// classpath locator builds the mod file from the single directory that holds
// META-INF/mods.toml. With Gradle's default layout that is build/resources/main,
// which contains no classes, so the run finds the metadata but not the @Mod
// class and refuses to load. Emitting resources into the classes directory puts
// both halves where the locator looks.
sourceSets.main.output.resourcesDir = layout.buildDirectory.dir('classes/java/main')

// Forge discovers mixin configs from the MixinConfigs jar manifest attribute.
// The [[mixins]] block in mods.toml that NeoForge uses is ignored here — with
// no warning — so a config declared only there silently never loads and every
// mixin in it is quietly inert.
def mixinConfigs = 'localweather.mixins.json,localweather.client.mixins.json'

jar {
    // Same classifier scheme as the NeoForge module, so the two loaders' jars
    // are told apart by name in a release's asset list.
    archiveClassifier = 'forge'

    manifest {
        attributes('MixinConfigs': mixinConfigs)
    }
    // The dev manifest below lands in the classes directory, which is also jar
    // input; the jar builds its own manifest from the block above.
    exclude 'META-INF/MANIFEST.MF'
}

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
        }
        register('client')
        register('server') {
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${project.forge_version}")
}

processResources {
    // A dev run loads the mod from loose directories rather than the jar, so the
    // MixinConfigs attribute has to exist in a MANIFEST.MF inside the output
    // directory too — which is the classes directory, for the same reason the
    // rest of the resources go there.
    doLast {
        def manifest = new File(destinationDir, 'META-INF/MANIFEST.MF')
        manifest.parentFile.mkdirs()
        manifest.text = "Manifest-Version: 1.0\nMixinConfigs: ${mixinConfigs}\n"
    }

    inputs.properties([
            mod_id: project.mod_id,
            mod_name: project.mod_name,
            mod_license: project.mod_license,
            mod_version: project.mod_version,
            minecraft_version: project.minecraft_version,
            minecraft_version_next: project.minecraft_version_next,
            forge_spec_version: project.forge_spec_version
    ])

    filesMatching('META-INF/mods.toml') {
        expand([
                mod_id: project.mod_id,
                mod_name: project.mod_name,
                mod_license: project.mod_license,
                mod_version: project.mod_version,
                minecraft_version: project.minecraft_version,
                minecraft_version_next: project.minecraft_version_next,
                forge_spec_version: project.forge_spec_version
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
