# Minecraft 26.4 snapshots, built with -Pmc=26.4-snapshot.
# A snapshot changes every week, so this file tracks the newest one Fabric API
# has a build for: bump minecraft_version, fabric_api_version and
# game_versions together when the next snapshot lands. Fabric only: NeoForge
# and Forge do not publish builds for snapshots.
source_line=v26
client_variant=client26_3
minecraft_version=26.4-snapshot-5
fabric_api_version=0.165.0+26.4
loader_version=0.20.1
minecraft_dependency=>=26.4- <26.5-
java_release=25
# Game versions this jar is published for.
game_versions=26.4-snapshot-5
