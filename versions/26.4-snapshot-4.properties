# Minecraft 26.4-snapshot-4, built with -Pmc=26.4-snapshot-4.
# One target per snapshot, each against the Fabric API build made for it,
# since vanilla code can move between snapshots. Fabric only: NeoForge and
# Forge publish no snapshot builds. When a new snapshot lands, copy the
# newest of these files and bump the three version lines.
# Fabric API's builds for this snapshot need Fabric Loader 0.20, so this
# target asks for it; the released targets keep the default.
source_line=v26
client_variant=client26_3
minecraft_version=26.4-snapshot-4
fabric_api_version=0.164.0+26.4
loader_version=0.20.1
minecraft_dependency=>=26.4- <26.5-
java_release=25
# Game versions this jar is published for.
game_versions=26.4-snapshot-4
